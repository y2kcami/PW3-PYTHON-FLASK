<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Mundo dos Doramas
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

<nav class="navbar navbar-expand-lg custom-navbar">

    <div class="container">

        <a
            class="navbar-brand logo-area"
            href="{{ url_for('routes.index') }}"
        >

            <img
                src="{{ url_for('static', filename='imgs/logo.png') }}"
                alt="DoramaFlix"
                class="logo"
            >

            <span class="logo-name">
                Mundo<span>dos</span>Doramas
            </span>

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menu"
            aria-controls="menu"
            aria-expanded="false"
            aria-label="Abrir menu"
        >

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="menu"
        >


            <ul class="navbar-nav mx-auto">


                <li class="nav-item">

                    <a
                        class="nav-link custom-link"
                        href="{{ url_for('routes.index') }}"
                    >
                        Início
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link custom-link"
                        href="{{ url_for('routes.doramas') }}"
                    >
                        Doramas
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        class="nav-link custom-link"
                        href="{{ url_for('routes.api_doramas') }}"
                    >
                        API
                    </a>

                </li>


            </ul>
            <form
                class="search-form"
                action="{{ url_for('routes.pesquisar') }}"
                method="GET"
            >

                <input
                    class="search-input"
                    type="search"
                    name="q"
                    placeholder="Pesquisar dorama"
                    aria-label="Pesquisar dorama"
                >


                <button
                    class="search-button"
                    type="submit"
                >
                    Buscar
                </button>

            </form>


        </div>

    </div>

</nav>

<main>

    {% block content %}
    {% endblock %}

</main>

<footer class="custom-footer">

    <div class="container">


        <div class="footer-content">


            <div class="footer-brand">

                <img
                    src="{{ url_for('static', filename='imgs/logo.png') }}"
                    alt="DoramaFlix"
                >

                <div>

                    <h5>
                        Mundo dos Doramas
                    </h5>

                    <p>
                        Catálogo de doramas coreanos.
                    </p>

                </div>

            </div>


            <div class="footer-info">

                <p>
                    © 2026 Mundo dos Doramas
                </p>

                <span>
                    Dados fornecidos pela TMDB
                </span>

            </div>


        </div>


        <div class="footer-line"></div>
    </div>
</footer>
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>
</body>
</html>
