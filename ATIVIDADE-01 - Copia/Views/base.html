<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo Cinemático</title>
   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">
</head>

<body>

<header>
    <h1 style="text-align:center;">UNIVERSO CINEMÁTICO</h1>
</header>

<nav class="navbar navbar-expand-lg">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarSupportedContent">

      <ul class="navbar-nav me-auto mb-2 mb-lg-0">

        <li class="nav-item">
          <a class="nav-link active" href="{{url_for('home')}}">Início</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{url_for('filmes_page')}}">Filmes</a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="{{url_for('cadfilmes')}}">Cadastrar filme</a>
        </li>

      </ul>

      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Buscar filme...">
        <button class="btn btn-outline-danger" type="submit">Buscar</button>
      </form>

    </div>
  </div>
</nav>

<!-- CONTEÚDO -->
{% block content %}
{% endblock content %}

<!-- FOOTER -->
<footer>
    <hr>
    <p style="text-align: center;">
        &copy; 2026 - UNIVERSO CINEMÁTICO - TODOS OS DIREITOS RESERVADOS.
    </p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
