<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNIVERSO CINEMÁTICO</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #ff1a1a;
            font-size: 38px;
            margin-bottom: 10px;
        }

        hr {
            width: 50%;
            border: 1px solid #ff1a1a;
            margin-bottom: 30px;
        }

        form {
            width: 50%;
            margin: 0 auto 40px auto;
            background-color: #111;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        label {
            display: block;
            text-align: left;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #330000;
            background-color: #000;
            color: white;
            border-radius: 5px;
        }

        input:focus, select:focus {
            outline: none;
            border: 1px solid #ff1a1a;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 5px;
            background-color: #ff1a1a;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #ff1a1a;
        }
    </style>

</head>
<body>

    <h1>CADASTRO DE FILMES</h1>
    <hr>

    <form>

        <label>NOME DO FILME:</label>
        <input type="text" required>

        <label>ANO DE LANÇAMENTO:</label>
        <input type="number" min="1950" max="2026" required>

        <label>GÊNERO:</label>
        <input type="text" required>
 
        <label>NOTA:</label>
        <input type="number" min="0" max="10" step="1">

        <label>DURAÇÃO (MINUTOS):</label>
        <input type="number" min="1">

        <button type="submit">CADASTRAR</button>

    </form>

</body>
</html>
