<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>UNIVERSO CINEMÁTICO</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: white;
            text-align: center;
            margin: 0;
            padding: 40px;
        }

        h1 {
            color: #ff1a1a;
            font-size: 38px;
            margin-bottom: 10px;
        }

        hr {
            width: 50%;
            border: 1px solid #ff1a1a;
            margin-bottom: 30px;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 80%;
            background-color: #111;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        th {
            background-color: #cc0000;
            padding: 15px;
            font-size: 15px;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #333;
        }

        tr:hover {
            background-color: #1a0000;
            transition: 0.3s;
        }

        th, td {
            border: 1px solid #330000;
        }
    </style>
</head>

<body>

    <h1>NOSSO CINEMINHA</h1>
    <hr>

    <table>
        <tr>
            <th>FILME</th>
            <th>ANO DE LANÇAMENTO</th>
            <th>GÊNERO</th>
            <th>NOTA</th>
            <th>DURAÇÃO</th>
        </tr>

        <tr>
            <td>Interestelar</td>
            <td>2014</td>
            <td>Ficção Científica / Drama</td>
            <td>9.5</td>
            <td>2h 49min</td>
        </tr>

        <tr>
            <td>A Barraca do Beijo</td>
            <td>2018</td>
            <td>Romance / Comédia</td>
            <td>6.0</td>
            <td>1h 45min</td>
        </tr>

        <tr>
            <td>Meninas Malvadas</td>
            <td>2004</td>
            <td>Comédia</td>
            <td>8.0</td>
            <td>1h 37min</td>
        </tr>

        <tr>
            <td>Shrek</td>
            <td>2001</td>
            <td>Animação / Comédia</td>
            <td>8.5</td>
            <td>1h 30min</td>
        </tr>
    </table>

</body>
</html>
