{% extends 'base.html' %}

{% block content %}

<h2>✏️ Editar Console</h2>

<div class="col-md-4">
    <form action="/estoque-consoles/update/{{ console.id }}" method="POST">

        <label class="form-label">Nome</label>
        <input type="text" class="form-control" name="nome" value="{{ console.nome }}" required>

        <label class="form-label">Fabricante</label>
        <input type="text" class="form-control" name="fabricante" value="{{ console.fabricante }}" required>

        <label class="form-label">Ano</label>
        <input type="number" class="form-control" name="ano" value="{{ console.ano }}" required>

        <label class="form-label">Preço</label>
        <input type="number" step="0.01" class="form-control" name="preco" value="{{ console.preco }}" required>

        <label class="form-label">Quantidade</label>
        <input type="number" class="form-control" name="quantidade" value="{{ console.quantidade }}" required>

        <div class="mt-3">
            <button type="submit" class="btn btn-success">Salvar</button>
            <a href="/estoque-consoles" class="btn btn-secondary">Voltar</a>
        </div>

    </form>
</div>

{% endblock %}
